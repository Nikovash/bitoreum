# This workflow has been annotated to exclude test builds.
# To re-enable tests in the future, uncomment all marked lines.

name: Full Crystal Bitoreum Build

on:
  push:
    branches:
      - main
      - dev
      - Codex
      - 4.x
    tags:
      - v*
  pull_request:
    branches:
      - main
      - dev
      - Codex
      - 4.x
  workflow_dispatch:

env:
  COIN_NAME: bitoreum
  BUILD_DIR: bitoreum-build
  COMPRESS_DIR: bitoreum-compress
  TEST_DIR: bitoreum-test

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.selected-version.outputs.version }}

    steps:
      - name: Triggered By
        run: |
          echo "checking out $GITHUB_REF triggered by $GITHUB_EVENT_NAME"
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Version Logic
        id: selected-version
        run: |
          VERSION=$(grep '^release-version=' build.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION=$VERSION" > version.txt
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.txt

  build-ubuntu24-x86:
    name: Ubuntu 24 x86 Build
    needs: get-version
    runs-on: ubuntu-24.04
    env:
      ARCH_TYPE: x86
      OS: ubuntu-24.04
      BUILD_DIR: build
      COMPRESS_DIR: compress
#     TEST_DIR: test
      COIN_NAME: bitoreum

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Required Packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl build-essential libtool autotools-dev automake pkg-config python3 bsdmainutils cmake
      - name: Build Depends
        run: |
          echo "building with $(nproc) threads"
          make -C depends -j$(nproc) HOST=x86_64-pc-linux-gnu
      - name: Configure
        run: |
          ./autogen.sh
          ./configure --prefix=$(pwd)/depends/x86_64-pc-linux-gnu --disable-tests --disable-bench
      - name: Build Binaries
        run: |
          make -j$(nproc)
          mkdir -p ${BUILD_DIR} ${BUILD_DIR}_not_strip
          cp src/{bitoreum-cli,bitoreumd,bitoreum-tx,qt/bitoreum-qt} ${BUILD_DIR}/
          cp src/{bitoreum-cli,bitoreumd,bitoreum-tx,qt/bitoreum-qt} ${BUILD_DIR}_not_strip/
          strip ${BUILD_DIR}/* || true
      - name: Build Debug Binaries
        run: |
          make clean
          make distclean
          ./autogen.sh
          ./configure --prefix=$(pwd)/depends/x86_64-pc-linux-gnu --disable-tests --enable-debug --disable-bench
          make -j$(nproc)
          mkdir -p ${BUILD_DIR}_debug
          cp src/{bitoreum-cli,bitoreumd,bitoreum-tx,qt/bitoreum-qt} ${BUILD_DIR}_debug/
      - name: Generate Checksum and Compress
        run: |
          mkdir -p ${COMPRESS_DIR}
          for dir in "${BUILD_DIR}" "${BUILD_DIR}_debug" "${BUILD_DIR}_not_strip"; do
            case $dir in
              *debug) suffix="debug" ;;
              *_not_strip) suffix="notstrip" ;;
              *) suffix="release" ;;
            esac
            rm -rf temp
            mkdir -p temp/bitoreum-build
            # Copy binaries into build folder
            cp $dir/bitoreum-cli $dir/bitoreumd $dir/bitoreum-qt $dir/bitoreum-tx temp/bitoreum-build/
            # Generate checksums inside the build folder
            pushd temp/bitoreum-build
            echo "sha256:" > checksums.txt
            echo "------------------------------------" >> checksums.txt
            shasum bitoreum-cli bitoreumd bitoreum-qt bitoreum-tx >> checksums.txt
            echo "------------------------------------" >> checksums.txt
            echo "openssl-sha256:" >> checksums.txt
            echo "------------------------------------" >> checksums.txt
            sha256sum bitoreum-cli bitoreumd bitoreum-qt bitoreum-tx >> checksums.txt
            popd
            # Compress into tarball with structured name
            tar -czf ${COIN_NAME}-${OS}-${ARCH_TYPE}-${suffix}-${{ needs.get-version.outputs.version }}.tar.gz -C temp bitoreum-build
          done
          mv *.tar.gz ${COMPRESS_DIR}/
          # Global checksums for tarballs
          cd ${COMPRESS_DIR}
          echo "Checksums for release archives:" > checksums.txt
          echo "------------------------------------" >> checksums.txt
          for f in *.tar.gz; do
            echo "$f" >> checksums.txt
            echo "sha256: $(shasum $f)" >> checksums.txt
            echo "openssl-sha256: $(sha256sum $f)" >> checksums.txt
            echo "------------------------------------" >> checksums.txt
          done
          cat checksums.txt
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-${{ env.OS }}-${{ env.ARCH_TYPE }}-${{ needs.get-version.outputs.version }}
          path: ${{ env.COMPRESS_DIR }}

#      - name: Upload Test Artifacts
#        uses: actions/upload-artifact@v4
#        with:
#          name: ${{ env.COIN_NAME }}-${{ env.OS }}-${{ env.ARCH_TYPE }}-test-${{ needs.get-version.outputs.version }}
#          path: ${{ env.TEST_DIR }}


