  build-macos-13-x86:
    name: macOS 13 x86 Build
    needs: get-version
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Required Packages
        run: |
          brew install automake libtool pkg-config miniupnpc librsvg libnatpmp zeromq python
          pip3 install ds_store mac_alias
          pip3 install -U pip setuptools
          for pkg in automake libtool pkg-config miniupnpc librsvg libnatpmp zeromq python; do
            if ! brew list --versions "$pkg" >/dev/null 2>&1; then
              echo "Installing $pkg..."
              brew install "$pkg"
            else
              echo "$pkg already installed, skipping."
            fi
          done
          pip3 install -U pip setuptools
          pip3 install ds_store mac_alias

      - name: Build Depends
        run: |
          echo "building with $(sysctl -n hw.ncpu) threads"
          make -C depends -j$(sysctl -n hw.ncpu) HOST=x86_64-apple-darwin22

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --prefix=$(pwd)/depends/x86_64-apple-darwin22

      - name: Build Binaries
        run: |
          make -j$(sysctl -n hw.ncpu)
          mkdir -p ${BUILD_DIR} ${BUILD_DIR}_not_strip
          for f in src/bitoreum-cli src/bitoreumd src/qt/bitoreum-qt; do
            if [ -f "$f" ]; then
              cp "$f" "${BUILD_DIR}/"
              cp "$f" "${BUILD_DIR}_not_strip/"
            fi
          done

          for f in bitoreum-cli bitoreumd bitoreum-qt; do
            if [ -f "${BUILD_DIR}/$f" ]; then
              xcrun strip -x "${BUILD_DIR}/$f" || true
            fi
          done

          echo "Contents of ${BUILD_DIR}:"
          ls -l "${BUILD_DIR}"
          echo "Contents of ${BUILD_DIR}_not_strip:"
          ls -l "${BUILD_DIR}_not_strip"

      - name: Generate Checksum and Compress
        run: |
          # Release (stripped)
          pushd "${BUILD_DIR}"
          echo "sha256:" >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          shasum -a 256 * >> checksums.txt || true
          echo "------------------------------------" >> checksums.txt
          echo "openssl-sha256:" >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          openssl sha256 * >> checksums.txt || true
          /usr/bin/zip -r -9 "../${COIN_NAME}-macOS13-x86-release-${{ needs.get-version.outputs.version }}.zip" .
          popd

          # Not-strip
          pushd "${BUILD_DIR}_not_strip"
          echo "sha256:" >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          shasum -a 256 * >> checksums.txt || true
          echo "------------------------------------" >> checksums.txt
          echo "openssl-sha256:" >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          openssl sha256 * >> checksums.txt || true
          /usr/bin/zip -r -9 "../${COIN_NAME}-macOS13-x86-notstrip-${{ needs.get-version.outputs.version }}.zip" .
          popd

          # Collect archives and global checksums
          mkdir -p "${COMPRESS_DIR}"
          mv ./*.zip "${COMPRESS_DIR}/"
          pushd "${COMPRESS_DIR}"
          {
            echo "Checksums for release archives:"
            echo "------------------------------------"
            for f in *.zip; do
              echo "$f"
              echo "sha256: $(shasum "$f")"
              echo "openssl-sha256: $(openssl sha256 "$f")"
              echo "------------------------------------"
            done
          } > checksums.txt
          cat checksums.txt
          popd

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-macOS13-x86-${{ needs.get-version.outputs.version }}
          path: ${{ env.COMPRESS_DIR }}

      - name: Generate Macos dmg files
        run: |
          make deploy
          mkdir -p macos-dmg
          mv Bitoreum-Qt.dmg macos-dmg/Crystal-Bitoreum-Qt.dmg
          cd macos-dmg
          echo "sha256: $(shasum Crystal-Bitoreum-Qt.dmg)" >> checksums.txt
          echo "openssl-sha256: $(openssl sha256 Crystal-Bitoreum-Qt.dmg)" >> checksums.txt
          cd ..
      - name: Upload dmg file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-macOS13-x86-dmg-${{ needs.get-version.outputs.version }}
          path: macos-dmg

