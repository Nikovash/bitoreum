  build-macos-13-x86:
    name: macOS 13 x86 Build
    needs: get-version
    runs-on: macos-13

    env:
      RELEASE_DIR: bitoreum-v${{ needs.get-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Required Packages
        run: |
          brew install automake libtool pkg-config miniupnpc librsvg libnatpmp zeromq python
          pip3 install ds_store mac_alias
          pip3 install -U pip setuptools

      - name: Build Depends
        run: |
          echo "building with 8 threads"
          make -C depends -j8 HOST=x86_64-apple-darwin22

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --prefix=$(pwd)/depends/x86_64-apple-darwin22

      - name: Build Binaries
        run: |
          make -j8
          mkdir -p ${BUILD_DIR} ${BUILD_DIR}_not_strip ${TEST_DIR}
          cp src/{bitoreum-cli,bitoreumd,bitoreum-tx,qt/bitoreum-qt} ${BUILD_DIR}/
          mv src/{bitoreum-cli,bitoreumd,bitoreum-tx,qt/bitoreum-qt} ${BUILD_DIR}_not_strip/
          mv src/test/test_bitoreum ${TEST_DIR}
          strip ${BUILD_DIR}/*

      - name: Organize Artifacts
        run: |
          mkdir -p ${RELEASE_DIR}/release ${RELEASE_DIR}/notstrip
          cp ${BUILD_DIR}/* ${RELEASE_DIR}/release/
          cp ${BUILD_DIR}_not_strip/* ${RELEASE_DIR}/notstrip/
          for d in release notstrip; do
            pushd ${RELEASE_DIR}/$d
            echo "sha256:" > checksums.txt
            shasum * >> checksums.txt
            echo "openssl-sha256:" >> checksums.txt
            openssl sha256 * >> checksums.txt
            popd
          done
      - name: Compress Artifacts
        run: |
          mkdir -p ${COMPRESS_DIR}
          pushd $(dirname ${RELEASE_DIR})
          rel_dir=$(basename ${RELEASE_DIR})
          for d in release notstrip; do
            tar -czf ../${COIN_NAME}-macOS13-x86-${d}-${{ needs.get-version.outputs.version }}.tar.gz ${rel_dir}/$d
          done
          popd
          mv *.tar.gz ${COMPRESS_DIR}/
          cd ${COMPRESS_DIR}
          for f in *.tar.gz; do
            echo "$f" >> checksums.txt
            echo "sha256: $(shasum $f)" >> checksums.txt
            echo "openssl-sha256: $(openssl sha256 $f | awk '{print $2}')" >> checksums.txt
          done
          cat checksums.txt
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-macOS13-x86-${{ needs.get-version.outputs.version }}
          path: ${{ env.COMPRESS_DIR }}

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-macOS13-x86-test-${{ needs.get-version.outputs.version }}
          path: ${{ env.TEST_DIR }}

      - name: Generate Macos dmg files
        run: |
          make deploy
          mkdir -p macos-dmg
          mv Bitoreum-Qt.dmg macos-dmg/Crystal-Bitoreum-Qt.dmg
          cd macos-dmg
          echo "sha256: $(shasum Crystal-Bitoreum-Qt.dmg)" >> checksums.txt
          echo "openssl-sha256: $(openssl sha256 Crystal-Bitoreum-Qt.dmg)" >> checksums.txt
          cd ..

      - name: Upload dmg file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-macOS13-x86-dmg-${{ needs.get-version.outputs.version }}
          path: macos-dmg
