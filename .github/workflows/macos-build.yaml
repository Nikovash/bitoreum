# This workflow has been annotated to exclude test builds.
# To re-enable tests in the future, uncomment all marked lines.

name: Crystal Bitoreum Build for macOS

on:
  push:
    branches:
      - main
      - dev
      - Codex
      - 4.x
    tags:
      - v*
  pull_request:
    branches:
      - main
      - dev
      - Codex
      - 4.x
  workflow_dispatch:

env:
  COIN_NAME: bitoreum
  BUILD_DIR: bitoreum-build
  COMPRESS_DIR: bitoreum-compress
  TEST_DIR: bitoreum-test

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.selected-version.outputs.version }}

    steps:
      - name: Triggered By
        run: |
          echo "checking out $GITHUB_REF triggered by $GITHUB_EVENT_NAME"
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Version Logic
        id: selected-version
        run: |
          VERSION=$(grep '^release-version=' build.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION=$VERSION" > version.txt
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.txt

  build-macos-12-x86:
    name: macOS 12 x86 Build
    needs: get-version
    runs-on: macos-15-intel
    env:
      MACOS_LABEL: macOS12
      ARCH_TYPE: x86
      OSX_HOST: x86_64-apple-darwin21

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Required Packages
        run: |
          for pkg in automake libtool pkg-config miniupnpc librsvg libnatpmp zeromq python; do
            if ! brew list --versions "$pkg" >/dev/null 2>&1; then
              echo "Installing $pkg..."
              brew install "$pkg"
            else
              echo "$pkg already installed, skipping."
            fi
          done

          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -U pip setuptools
          python -m pip install ds_store mac_alias
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build Depends
        run: |
          clang++ --version
          xcodebuild -version
          sw_vers
          echo "building with $(sysctl -n hw.ncpu) threads"
          make -C depends -j$(sysctl -n hw.ncpu) HOST=${OSX_HOST}

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --prefix=$(pwd)/depends/${OSX_HOST}

      - name: Build Binaries
        run: |
          make -j$(sysctl -n hw.ncpu)
          mkdir -p ${BUILD_DIR} ${BUILD_DIR}_not_strip
          for f in src/bitoreum-cli src/bitoreumd src/qt/bitoreum-qt; do
            if [ -f "$f" ]; then
              cp "$f" "${BUILD_DIR}/"
              cp "$f" "${BUILD_DIR}_not_strip/"
            fi
          done

          for f in bitoreum-cli bitoreumd bitoreum-qt; do
            if [ -f "${BUILD_DIR}/$f" ]; then
              xcrun strip -x "${BUILD_DIR}/$f" || true
            fi
          done

          ls -l "${BUILD_DIR}"
          ls -l "${BUILD_DIR}_not_strip"

      - name: Generate Checksum and Compress
        run: |
          pushd "${BUILD_DIR}"
          echo "sha256:" >> checksums.txt
          shasum -a 256 * >> checksums.txt || true
          echo "openssl-sha256:" >> checksums.txt
          openssl sha256 * >> checksums.txt || true
          /usr/bin/zip -r -9 "../${COIN_NAME}-${MACOS_LABEL}-${ARCH_TYPE}-release-${{ needs.get-version.outputs.version }}.zip" .
          popd

          pushd "${BUILD_DIR}_not_strip"
          echo "sha256:" >> checksums.txt
          shasum -a 256 * >> checksums.txt || true
          echo "openssl-sha256:" >> checksums.txt
          openssl sha256 * >> checksums.txt || true
          /usr/bin/zip -r -9 "../${COIN_NAME}-${MACOS_LABEL}-${ARCH_TYPE}-notstrip-${{ needs.get-version.outputs.version }}.zip" .
          popd

          mkdir -p "${COMPRESS_DIR}"
          mv ./*.zip "${COMPRESS_DIR}/"

          pushd "${COMPRESS_DIR}"
          {
            echo "Checksums for release archives:"
            echo "------------------------------------"
            for f in *.zip; do
              echo "$f"
              echo "sha256: $(shasum "$f")"
              echo "openssl-sha256: $(openssl sha256 "$f")"
              echo "------------------------------------"
            done
          } > checksums.txt
          cat checksums.txt
          popd

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-${{ env.MACOS_LABEL }}-${{ env.ARCH_TYPE }}-${{ needs.get-version.outputs.version }}
          path: ${{ env.COMPRESS_DIR }}

      - name: Generate macOS dmg files
        run: |
          make deploy
          mkdir -p macos-dmg
          mv Bitoreum-Qt.dmg macos-dmg/Crystal-Bitoreum-Qt.dmg
          cd macos-dmg
          echo "sha256: $(shasum Crystal-Bitoreum-Qt.dmg)" >> checksums.txt
          echo "openssl-sha256: $(openssl sha256 Crystal-Bitoreum-Qt.dmg)" >> checksums.txt

      - name: Upload dmg file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-${{ env.MACOS_LABEL }}-${{ env.ARCH_TYPE }}-dmg-${{ needs.get-version.outputs.version }}
          path: macos-dmg
          
#      - name: Upload Test Artifacts
#        uses: actions/upload-artifact@v4
#        with:
#          name: ${{ env.COIN_NAME }}-macOS13-x86-test-${{ needs.get-version.outputs.version }}
#          path: ${{ env.TEST_DIR }}

